[project]
name = "risk-engine"
version = "0.1.0"
description = "DeFi dependency discovery, shock propagation and stay-or-exit decision engine"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "networkx>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["risk_engine"]
